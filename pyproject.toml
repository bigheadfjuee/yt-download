[project]
name = "yt-download"
version = "0.1.0"
description = "YouTube 影片下載工具（支援付費帳號 Cookies、4K/1080p Premium、音訊、字幕、播放清單、Web 介面與 CLI）"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.12",
    "rich>=13.9.0",
    "truststore>=0.10.0",
    "typer>=0.12.5",
    "uvicorn[standard]>=0.32.0",
    "yt-dlp[default]>=2025.1.1",
]

[project.scripts]
yt-dl = "yt_download.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27.2",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_download"]

[tool.pytest.ini_options]
testpaths = ["tests"]
